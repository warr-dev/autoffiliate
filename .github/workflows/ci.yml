name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, curl, zip, pcntl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install NPM Dependencies
        run: npm ci

      - name: Prepare Environment File & SQLite Database
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan wayfinder:generate --with-form || true

      - name: Check TypeScript & Svelte Types
        run: npm run types:check

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Test Suite (PHPUnit / Pest)
        run: php artisan test

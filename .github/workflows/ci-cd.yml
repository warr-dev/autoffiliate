name: CI/CD - Build with Node & Deploy via SSH

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. BUILD WITH NODE & RUN TEST SUITE
  # ============================================================================
  build-and-test:
    name: 📦 Build Frontend (Node 20) & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, curl, zip, pcntl
          coverage: none

      - name: Setup Node.js (Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install NPM Dependencies
        run: npm ci

      - name: Prepare Environment File & SQLite Database
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan wayfinder:generate --with-form || true

      - name: 🔨 Compile Production Frontend Assets (Vite)
        run: npm run build

      - name: 📤 Upload Compiled Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/

      - name: Run Database Migrations (SQLite)
        run: php artisan migrate --force

      - name: Run Test Suite (PHPUnit / Pest)
        run: php artisan test

  # ============================================================================
  # 2. DEPLOY VIA SSH TO HOSTINGER
  # ============================================================================
  deploy:
    name: 🚀 Deploy via SSH to Hostinger
    runs-on: ubuntu-latest
    needs: build-and-test
    # Triggers automatically when pushed or dispatched to the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Compiled Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build/

      - name: 🚀 Transfer Built Assets to Server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST || secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER || secrets.SSH_USER || vars.SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || vars.HOSTINGER_SSH_PASSWORD || secrets.SSH_PASSWORD || vars.SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || vars.HOSTINGER_SSH_KEY || secrets.SSH_KEY || vars.SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT || secrets.SSH_PORT || vars.SSH_PORT || '65002' }}
          source: "public/build/*"
          target: ${{ secrets.HOSTINGER_APP_PATH || vars.HOSTINGER_APP_PATH || secrets.SSH_PATH || vars.SSH_PATH || '/var/www/autoffiliate' }}
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST || secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER || secrets.SSH_USER || vars.SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || vars.HOSTINGER_SSH_PASSWORD || secrets.SSH_PASSWORD || vars.SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || vars.HOSTINGER_SSH_KEY || secrets.SSH_KEY || vars.SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT || secrets.SSH_PORT || vars.SSH_PORT || '65002' }}
          script: |
            # Determine target application directory
            TARGET_DIR="${{ secrets.HOSTINGER_APP_PATH || vars.HOSTINGER_APP_PATH || secrets.SSH_PATH || vars.SSH_PATH }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "/var/www/autoffiliate" ]; then
                TARGET_DIR="/var/www/autoffiliate"
              elif [ -d "$HOME/domains/${{ vars.HOSTINGER_DOMAIN || 'autoffiliate' }}/app" ]; then
                TARGET_DIR="$HOME/domains/${{ vars.HOSTINGER_DOMAIN || 'autoffiliate' }}/app"
              else
                TARGET_DIR="$HOME/public_html"
              fi
            fi

            echo "======================================================"
            echo "📂 Deploying to target directory: $TARGET_DIR"
            echo "======================================================"
            cd "$TARGET_DIR" || exit 1

            echo "🔒 Enabling maintenance mode..."
            php artisan down || true

            echo "📥 Pulling latest pre-built codebase from GitHub..."
            git pull origin main

            echo "📦 Installing PHP dependencies (no Node.js needed on server)..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            echo "⚡ Optimizing Laravel caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan wayfinder:generate || true

            if command -v supervisorctl &> /dev/null; then
              echo "🔄 Restarting background worker daemons..."
              sudo supervisorctl restart all || true
            fi

            echo "🔓 Disabling maintenance mode..."
            php artisan up

            echo "======================================================"
            echo "✅ Autoffiliate successfully deployed to Hostinger!"
            echo "======================================================"

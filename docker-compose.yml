services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoffiliate-app:dev
    container_name: autoffiliate_dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8000"
      - "${VITE_PORT:-5001}:${VITE_PORT:-5001}"
    volumes:
      - .:/app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=${APP_URL:-http://localhost:8001}
      - VITE_PORT=${VITE_PORT:-5001}
      - VITE_HMR_HOST=${VITE_HMR_HOST:-warpc}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-example}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "
        composer install --prefer-dist --no-interaction || true
        php artisan storage:link || true
        php artisan migrate --force
        npx concurrently 'php artisan serve --host=0.0.0.0 --port=8000' 'npm run dev -- --host 0.0.0.0 --port 5001'
      "
    networks:
      - autoffiliate-network

  db:
    image: mariadb:11
    container_name: autoffiliate_db_dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 'example'
      MARIADB_DATABASE: 'laravel'
      MARIADB_USER: 'laravel'
      MARIADB_PASSWORD: 'example'
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - autoffiliate_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autoffiliate-network

  redis:
    image: redis:7-alpine
    container_name: autoffiliate_redis_dev
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    volumes:
      - autoffiliate_redis_data:/data
    networks:
      - autoffiliate-network

networks:
  autoffiliate-network:
    driver: bridge

volumes:
  autoffiliate_db_data:
  autoffiliate_redis_data:
